name: us-swing-scan

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC Mon–Fri = after the US close (main run; ~3:47 AM IST)
    - cron: "17 23 * * 1-5"   # 23:17 UTC retry; skips itself if the main run succeeded
    - cron: "17 3 * * 2-6"    # 03:17 UTC retry (still the same evening in New York)
  workflow_dispatch:           # "Run workflow" button for manual runs

permissions:
  contents: write              # lets the job commit output/ back to the repo

concurrency:
  group: us-swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Skip a retry if today's scan already succeeded
        id: check
        run: |
          today=$(TZ=America/New_York date +%F)
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ "${{ github.event.schedule }}" != "17 22 * * 1-5" ] \
             && grep -q '"status": "ok"' output/last_run.json 2>/dev/null \
             && grep -q "\"run_date\": \"$today\"" output/last_run.json 2>/dev/null; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip (New York date $today)"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run US screener
        if: steps.check.outputs.skip != 'true'
        run: python us_screener.py

      - name: Commit results
        if: always() && steps.check.outputs.skip != 'true'   # also commit the error report, so the Claude task can say what failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git add data/constituents 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "us scan $(TZ=America/New_York date +%F)"
            git pull --rebase --autostash
            git push
          fi
